[package]
name = "dirs-sys"
version = "0.5.0"
edition = "2021"
description = "Patched dirs-sys: adds env var fallback for APPDATA/LOCALAPPDATA on Windows (portable mode support)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dirs-dev/dirs-sys-rs"

[dependencies]
option-ext = "0.2.0"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[target.'cfg(target_os = "redox")'.dependencies]
redox_users = { version = "0.5", default-features = false, features = ["auth"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = ">=0.59.0", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
] }
